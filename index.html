<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/output.css">
    <link rel="stylesheet" href="/src/css/index.css">
    <title>To do list</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/src/js/modal.js"></script>

</head>
<body class="w-screen h-screen overflow-x-hidden overflow-y-auto bg-olive-100 flex flex-col md:flex-row justify-start md:justify-center items-stretch md:items-start px-4 md:px-10 py-6 md:py-10 gap-6 md:gap-10 box-border">
    
    <!--Filtering-->
    <aside id="filtering" class="shadow-md gap-5 p-5 w-full md:w-1/6 bg-white h-auto md:h-1/2 flex flex-col justify-self-center justify-start items-start md:items-center rounded-2xl">
        <h1 class="font-bold text-2xl">Filter items</h1>
        <form action="">
            <input type="checkbox" id="completed" name="completed">
            <label for="completed">completed</label><br>
            <input type="checkbox" id="pending" name="pending">
            <label for="completed">pending</label><br>
            <input type="checkbox" id="due" name="due">
            <label for="completed">due</label>
        </form>
    </aside>

    <!--Main parent container-->
    <main class="w-full md:flex-1 flex flex-col justify-start items-stretch md:items-center gap-6 md:gap-10 h-auto md:h-full px-4 md:px-10">
        
        <!--Navigation header-->
        <nav id="nav-header" class="shadow-sm bg-white w-full rounded-2xl h-auto md:h-24 py-4 md:py-8 flex flex-row flex-nowrap gap-3 md:gap-6 justify-center items-center">
            <div class="relative w-full sm:w-4/5 md:w-1/2 rounded-2xl h-13 outline-0 pl-10 pr-3 box-border">
                <input placeholder="search..." class="w-full border border-gray-300 rounded-md h-13 outline-0 pl-10 pr-3 box-border" type="text">
                <i class="fa-brands fa-sistrix absolute left-13 top-5"></i>
            </div>
            <input id="create-modal-button" class="bg-sky-500 h-12 md:h-13 rounded-md text-white w-12 md:w-13" type="button" value="+">
        </nav>

        <!--Empty task card-->
        <div id="no-task-container" class="border-dotted border-gray-400 justify-self-center flex flex-col md:flex-row bg-linear-to-b from-sky-300 to-sky-700 min-h-48 md:h-1/3 w-full rounded-2xl text-white justify-center items-center gap-4 md:gap-6 px-4 md:px-6 text-center md:text-left">
            <img class="h-32 w-44 md:h-50 md:w-70" src="/src/res/guy_resting.png" alt="">
            <h1 class="text-xl md:text-2xl">No tasks yet. <br> Do one now</h1>
        </div>

        <!--tasks container-->
        <div id="task-container" class="overflow-y-auto flex flex-col justify-start items-center w-full h-auto md:h-full">
            
            <div id="date-filter" class="sticky top-0 left-0 flex flex-wrap md:flex-nowrap w-full h-auto justify-center md:justify-end gap-2 md:gap-5">
                <input class="text-white rounded-md p-2 bg-green-300" type="button" value="Today">
                <input class="text-white rounded-md p-2 bg-green-300" type="button" value="Yesterday">
                <input class="text-white rounded-md p-2 bg-green-300" type="button" value="2 days ago and older">
            </div>

            <!--Here enters the tasks-->
            
        </div>

        <!--Create task modal-->
        <!--change from flex to hidden to hide modal-->
        <div id="modal" class="hidden flex-col absolute z-10 w-11/12 md:w-1/2 max-h-screen overflow-y-auto bg-white top-4 md:top-1/4 left-1/2 -translate-x-1/2 rounded-md shadow-lg box-border" id="create-task-modal" >
                <!--Modal header-->
            <div id="modal-header" class="h-15 flex justify-between items-center px-6 md:px-10">
                    <h1 class="text-xl">Create task</h1>
                    <button id="hide-modal-button" class="text-white bg-red-400 h-8 w-8 rounded-md">X</button>
                </div>

                <!--Modal body-->
                <div class="flex flex-col px-6 md:px-10 h-full gap-4 md:gap-5 overflow-y-auto">
                    <div class="flex flex-col w-full h-auto">
                        <label for="title">Title</label>
                        <input id="task-title" class="border border-gray-400 h-12 pl-10 outline-0 rounded-md" id="title" name="title" placeholder="Enter title" type="text">
                    </div>

                    <div class="flex flex-col w-full h-auto">
                        <label for="title">Description</label>
                        <input id="task-description" class="border border-gray-400 h-12 pl-10 outline-0 rounded-md" id="title" name="title" placeholder="Enter Description" type="text">
                    </div>

                    <div class="flex flex-col w-full h-auto">
                        <label for="task-deadline">Deadline</label>
                        <input id="task-deadline" class="border border-gray-400 h-12 pr-10 pl-10 outline-0 rounded-md" name="task-deadline" type="datetime-local">
                    </div>

                    <p>Select icon</p>
                    <div id="icon-group" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-7 border rounded-md border-gray-400 p-2 gap-2">
                        <button id="icon-1" class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-300">
                            <i class="fa-solid fa-recycle text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-green-300">
                            <i class="fa-solid fa-seedling text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-blue-700">
                            <i class="fa-solid fa-bed text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-300">
                            <i class="fa-solid fa-bowl-rice text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-600">
                            <i class="fa-solid fa-coins text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-olive-700">
                            <i class="fa-solid fa-dumbbell text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-blue-700">
                            <i class="fa-solid fa-school text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-300">
                            <i class="fa-solid fa-book text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-green-300">
                            <i class="fa-solid fa-running text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-red-700">
                            <i class="fa-solid fa-cross text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-300">
                            <i class="fa-solid fa-clock text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-600">
                            <i class="fa-solid fa-dog text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-olive-700">
                            <i class="fa-solid fa-people-line text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-blue-700">
                            <i class="fa-solid fa-truck text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-300">
                            <i class="fa-solid fa-shoe-prints text-white"></i>
                        </button>

                        <button class="icon h-10 w-10 justify-center items-center flex rounded-md bg-yellow-300">
                            <i class="fa-solid fa-phone text-white"></i>
                        </button>
                    </div>
                </div>

                <div class="h-25 flex justify-end px-6 md:px-10 pt-5" id="class-footer">
                    <button id="create-task-button" class=" bg-green-400 w-40 h-13 rounded-md text-white">
                        Create
                    </button>
                </div>
        </div>
    
    </main>
</body>
</html>
